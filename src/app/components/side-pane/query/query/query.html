<nav class="router-wrapper">
    <button
    #btnGenome="routerLinkActive"
    class="router-button"
    routerLinkActive="active-route"
    [routerLinkActiveOptions]="{ exact: true }"
    routerLink="query/genome"
    >
        <app-icon-query-genome
        class="query-icon"
        (mouseenter)="hoverGenome = true"
        (mouseleave)="hoverGenome = false"
        [svg_color]="btnGenome.isActive ? '#1f2937' : '#FAF0E6'">
        </app-icon-query-genome>
    </button>

    #btnGene="routerLinkActive"

        </app-icon-query-gene>
    </button>
